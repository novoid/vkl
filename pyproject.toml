[project]
name = "vkl"
version = "2018.02.03.03"
description = "vkl - a better ls-experience"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Karl Voit", email = "tools@Karl-Voit.at" },
]
keywords = ["file managing", "file management", "files", "shell"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/novoid/vkl"
Repository = "https://github.com/novoid/vkl"

[project.scripts]
vkl = "vkl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vkl"]
